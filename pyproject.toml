[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridiron_oracle"
version = "0.1.0"
description = "NFL game predictions with ML and graph-based Elo ratings"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "pydantic>=2.5"]

[project.optional-dependencies]
# Real play-by-play data from the nflverse project.
nflverse = ["nfl_data_py>=0.3"]
# Push teams and games into a Neo4j graph.
neo4j = ["neo4j>=5.0"]
# GRU over each team's last N games.
sequence = ["torch>=2.1"]
dev = ["pytest>=8"]

[project.scripts]
gridiron-oracle = "gridiron_oracle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
